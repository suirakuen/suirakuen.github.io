<html>
<head>
  <title>東方彗楽園サイト跡地</title>
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="apple_icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * {
      margin: 0px;
      padding: 0px;
      font-family: 'HGP創英角ﾎﾟｯﾌﾟ体',system-ui;
    }
    header {
      background-color: #ff8000d0;
      width: 100%;
      height: 60px;
      top: 0px;
      left: 0px;
      position: fixed;
    }
    header a {
      text-decoration: none;
      color: black;
      font-size: 50px;
    }
    #space {
      width: 100%;
      height: 60px;
      top: 0px;
      left: 0px;
    }
    footer {
      width: 100%;
      height: 24px;
      background-color: black;
      color: white;
      text-align: center;
      align-content: center;
      padding-top: 1px;
    }
    #test {
      color: red;
      font-size: 80px;
    }
    #sss {
      background-color: #a2ffa2;
      z-index: -1000;
      position: fixed;
      top: 45%;
      left: 45%;
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <header>
    <a href="https://suirakuen.github.io">ここにロゴ</a><font size="1">東方彗楽園サイト</font>
  </header>
  <div id="space"></div>
  <div id="sss"></div>
  <div id="test"></div>
  <script>
    for (var i = 0; i < 200; i++){
      document.getElementById('test').innerHTML += "これはテストのメッセージです。　";
    }
    document.querySelector("#sss").animate(
      {
        borderRadius: [
          "50% 50% 50% 70%/50% 50% 70% 60%",
          "80% 30% 50% 50%/50%",
          "40% 40% 50% 40%/30% 50% 40% 80%"
        ]
      },
      {
        iterations: Infinity,
        direction: "alternate",
        duration: 6000
      }
    );
  </script>
  <footer>2024 Made in Japan</footer>
</body>
</html>
